apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: logging
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      containers:
        - name: vector
          image: timberio/vector:0.44.X-debian
          resources:
            limits:
              memory: 200Mi
              cpu: 100m
          env:
            - name: ELASTIC_USER
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: user
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
            - name: VECTOR_CONFIG
              value: "/etc/vector/vector.yaml"
          volumeMounts:
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: vector-config
              mountPath: /etc/vector
              readOnly: true
      volumes:
        - name: var-log
          hostPath:
            path: /var/log
        - name: vector-config
          configMap:
            name: vector-config
