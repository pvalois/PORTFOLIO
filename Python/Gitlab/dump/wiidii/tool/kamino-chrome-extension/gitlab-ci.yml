image: node:alpine

stages:
  - lint
  - deploy
  #- build
  #- package
  #- deploy-test

linter check:
  stage: lint
  script:
    - npm install
    - ./node_modules/.bin/eslint ChromeExtension/src

deploy staging:
  stage: deploy
  only:
    - master
  script:
    - sed -i 's/{ENV_STRING}/Staging/g' ChromeExtension/manifest.json
    - npm install
    - CLIENT_ID=${KAMINO_CHROME_EXTENSION_CLIENT_ID} CLIENT_SECRET=${KAMINO_CHROME_EXTENSION_CLIENT_SECRET} EXTENSION_ID=${KAMINO_CHROME_EXTENSION_STAGING_ID} REFRESH_TOKEN=${KAMINO_CHROME_EXTENSION_REFRESH_TOKEN} node ./deploy.js

deploy production:
  stage: deploy
  when: manual
  only:
    - master
  script:
    - sed -i 's/{ENV_STRING}/Production/g' ChromeExtension/manifest.json
    - npm install
    - CLIENT_ID=${KAMINO_CHROME_EXTENSION_CLIENT_ID} CLIENT_SECRET=${KAMINO_CHROME_EXTENSION_CLIENT_SECRET} EXTENSION_ID=${KAMINO_CHROME_EXTENSION_ID} REFRESH_TOKEN=${KAMINO_CHROME_EXTENSION_REFRESH_TOKEN} node ./deploy.js
