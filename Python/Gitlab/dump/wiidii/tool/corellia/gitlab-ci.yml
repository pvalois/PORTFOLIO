stages:
  - build
  - test_coverage
  - package
  - deploy

dotnet publish:
  stage: build
  image: mcr.microsoft.com/dotnet/core/sdk:2.2-alpine
  script:
    - dotnet publish -c Release --source ${NUGET_NEXUS_SERVER_PRIVATE_URL} --source ${NUGET_SERVER_PUBLIC_URL}
  artifacts:
    name: "${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    untracked: true
    expire_in: 10 min
  except:
    - tags
  retry: 2

dotnet vstest:
  stage: test_coverage
  image: mcr.microsoft.com/dotnet/core/sdk:2.2-alpine
  script:
    - dotnet vstest $(find -path *\publish\*.UnitTests.dll)
  except:
    - tags
  retry: 2

minicover:
  stage: test_coverage
  image: mcr.microsoft.com/dotnet/core/sdk:2.2-alpine
  script:
    - dotnet build --source ${NUGET_NEXUS_SERVER_PRIVATE_URL} --source ${NUGET_SERVER_PUBLIC_URL}
    - mkdir coverage
    - cd coverage
    - echo '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>netcoreapp2.1</TargetFramework></PropertyGroup><ItemGroup><DotNetCliToolReference Include="MiniCover" Version="'${MINICOVER_VERSION}'" /></ItemGroup></Project>' > MiniCover.csproj
    - dotnet restore
    - dotnet minicover instrument --workdir ../ --assemblies test/**/bin/Debug/**/*.dll --sources src/**/*.cs --exclude-sources src/*/Startup.cs --exclude-sources src/*/Program.cs
    - cd ..
    - for project in test/**/*.UnitTests.csproj; do dotnet test --no-build $project; done
    - cd coverage
    - dotnet minicover report --workdir ../ --threshold ${COVERAGE_SERVICE_THRESHOLD}
    - dotnet minicover htmlreport --workdir ../ --threshold ${COVERAGE_SERVICE_THRESHOLD}
  artifacts:
    name: "coverage-${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    paths:
      - coverage-html/
    expire_in: 10 min
  except:
    - tags
  retry: 2

docker build/push:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA} .
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
  only:
    - master
  except:
    - tags
  retry: 2

sullust staging:
  stage: deploy
  image:
    name: alpine
  script:
    - apk add --no-cache curl
    - curl -X POST "http://${TRAEFIK_BACK_URL_STAG}/sullust-saas/api/deployment?dockerImage=${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}&environment=${ENVIRONMENT_STAG}"
  environment: 
    name: staging
  dependencies: []
  artifacts:
    name: "dump-${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    paths:
      - dump/
    expire_in: 1 hour
  only:
    - master
  except:
    - tags
  retry: 2

sullust production:
  stage: deploy
  image:
    name: alpine
  script:
    - apk add --no-cache curl
    - curl -X POST "http://${TRAEFIK_BACK_URL_STAG}/sullust-saas/api/deployment?dockerImage=${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}&environment=${ENVIRONMENT_PROD}"
  environment: 
    name: production
  dependencies: []
  artifacts:
    name: "dump-${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    paths:
      - dump/
    expire_in: 1 hour
  only:
    - tags
  retry: 2
