# This is just an example
# Go here for a real world example: http://tool.wiidii.com/wiidii/front/kamino/blob/master/.gitlab-ci.yml
stages:
  - lint
  - test
  - build
  - deploy

image: does-not-have-yarn

before_script:
  # Install yarn as outlined in (https://yarnpkg.com/lang/en/docs/install/#alternatives-stable)
  - curl -o- -L https://yarnpkg.com/install.sh | bash
  # Make available in the current terminal
  - export PATH="$HOME/.yarn/bin:$HOME/.config/yarn/global/node_modules/.bin:$PATH"

  # Cache node modules - speeds up future builds
cache:
  paths:
    - node_modules

lint:
  image: node:latest
  stage: lint
  script:
    - yarn
    - yarn lint

test:
  image: node:latest
  stage: test
  script:
    - yarn
    - yarn test:unit

build:
  image: node:latest
  stage: build
  script:
    - yarn
    - yarn build

# Job name for gitlab to recognise this results in assets for Gitlab Pages
# https://docs.gitlab.com/ee/user/project/pages/introduction.html#gitlab-pages-requirements
pages:
  image: node:latest
  stage: deploy
  script:
    - yarn # Install all dependencies
    - yarn build # Build for prod
    - cp public/index.html public/404.html # Not necessary, but helps with https://medium.com/@pshrmn/demystifying-single-page-applications-3068d0555d46
    - mv public _public # CRA and gitlab pages both use the public folder. Only do this in a build pipeline.
    - mv build public # Move build files to public dir for Gitlab Pages
  artifacts:
    paths:
      - public # The built files for Gitlab Pages to serve
