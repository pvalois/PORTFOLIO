stages:
  - install
  - test_coverage_lint
  - build
  - package
  - deploy

before_script:
  - apk add tzdata
  - cp /usr/share/zoneinfo/Europe/Paris /etc/localtime

npm ci:
  stage: install
  image: 
    name: node:lts-alpine
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 10 min
  retry: 2
  except: 
    - tags

npm run test:
  stage: test_coverage_lint
  image: 
    name: node:lts-alpine
  script:
    - npm run test
  retry: 2
  except: 
    - tags

npm run lint:
  stage: test_coverage_lint
  image: 
    name: node:lts-alpine
  script:
    - npm run lint
  retry: 2
  except: 
    - tags

jest --coverage:
  stage: test_coverage_lint
  image: 
    name: node:lts-alpine
  script:
    - npm run test:coverage --env=jsdom --coverageThreshold='{"global":{"branches":'${COVERAGE_FRONT_THRESHOLD}',"functions":'${COVERAGE_FRONT_THRESHOLD}',"lines":'${COVERAGE_FRONT_THRESHOLD}',"statements":'${COVERAGE_FRONT_THRESHOLD}'}}'
  retry: 2
  except: 
    - tags

npm run build:
  stage: build
  image: 
    name: node:lts-alpine
  script:
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 10 min
  retry: 2
  except: 
    - tags

serve config:
  stage: build
  image: 
    name: docker
  script:
    - 'echo "{ \"cleanUrls\": false }" > serve.json'
  artifacts:
    paths:
      - serve.json
    expire_in: 10 min
  only:
    - master
    - bugfix
  retry: 2
  except: 
    - tags

docker build/push_manual:
  stage: package
  image: 
    name: docker
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA} .
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
  except:
    - master
    - tags
  retry: 2
  when: manual

sullust staging_manual:
  stage: deploy
  image:
    name: alpine
  script:
    - apk add --no-cache curl
    - curl -X POST "http://${TRAEFIK_BACK_URL_STAG}/sullust-saas/api/deployment?dockerImage=${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}&branch=${CI_COMMIT_REF_NAME}&environment=${ENVIRONMENT_STAG}"
  environment: 
    name: staging
  dependencies: []
  artifacts:
    name: "dump-${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    paths:
      - dump/
    expire_in: 1 hour
  except:
    - master
    - tags
  retry: 2
  when: manual

docker build/push:
  stage: package
  image: 
    name: docker
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA} .
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
  only:
    - master
    - bugfix
  retry: 2
  except: 
    - tags

sullust staging:
  stage: deploy
  image:
    name: alpine
  script:
    - apk add --no-cache curl
    - curl -X POST "http://${TRAEFIK_BACK_URL_STAG}/sullust-saas/api/deployment?dockerImage=${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}&environment=${ENVIRONMENT_STAG}"
  environment: 
    name: staging
  dependencies: []
  artifacts:
    name: "dump-${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    paths:
      - dump/
    expire_in: 1 hour
  only:
    - master
  except:
    - tags
  retry: 2

