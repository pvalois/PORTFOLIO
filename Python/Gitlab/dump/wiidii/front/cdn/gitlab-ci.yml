stages:
  - build
  - package
  - deploy

dotnet publish:
  stage: build
  image: mcr.microsoft.com/dotnet/core/sdk:2.2-alpine
  script:
    - dotnet publish -c Release --source ${NUGET_NEXUS_SERVER_PRIVATE_URL} --source ${NUGET_SERVER_PUBLIC_URL}
  artifacts:
    name: "${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    untracked: true
    expire_in: 10 min
  except:
    - tags
  retry: 2

docker build/push_manual:
  stage: package
  image: 
    name: docker
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA} .
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
  except:
    - master
    - tags
  retry: 2
  when: manual

sullust staging_manual:
  stage: deploy
  image:
    name: alpine
  script:
    - apk add --no-cache curl
    - curl -X POST "http://${TRAEFIK_BACK_URL_STAG}/sullust-saas/api/deployment?dockerImage=${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}&branch=${CI_COMMIT_REF_NAME}&environment=${ENVIRONMENT_STAG}"
  environment: 
    name: staging
  dependencies: []
  artifacts:
    name: "dump-${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    paths:
      - dump/
    expire_in: 1 hour
  except:
    - master
    - tags
  retry: 2
  when: manual
  
docker build/push:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA} .
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
  only:
    - master
  except: 
    - tags

