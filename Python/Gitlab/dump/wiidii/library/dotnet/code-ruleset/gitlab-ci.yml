stages:
  - build
  - test_coverage
  - package
  - push

dotnet check:
  stage: build
  image: mcr.microsoft.com/dotnet/core/sdk:2.2-alpine
  script: 
    - export PATH="$PATH:/root/.dotnet/tools"
    - dotnet tool install --add-source ${NUGET_NEXUS_SERVER_PRIVATE_URL} -g ProjectChecker
    - ProjectChecker
  except:
    - tags
  retry: 2

dotnet publish:
  stage: build
  image: microsoft/dotnet:latest
  script:
    - dotnet publish -c Debug --source ${NUGET_NEXUS_SERVER_PRIVATE_URL} --source ${NUGET_SERVER_PUBLIC_URL}
  artifacts:
    name: "${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    untracked: true
    expire_in: 10 min
  retry: 2

dotnet pack:
  stage: package
  image: microsoft/dotnet:latest
  artifacts:
    name: "package-${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    untracked: true
    expire_in: 10 min
  script:
    - dotnet pack -c Debug --source ${NUGET_NEXUS_SERVER_PRIVATE_URL} --source ${NUGET_SERVER_PUBLIC_URL} --no-build
  only:
    - master
  retry: 2

dotnet nuget push:
  stage: push
  image: microsoft/dotnet:latest
  script:
    - find -path *.nupkg | xargs -i dotnet nuget push {} -s ${NUGET_NEXUS_SERVER_PRIVATE_URL}
    - find -path *.nupkg | xargs -i dotnet nuget push {} --api-key ${NUGET_NEXUS_API_KEY} -s ${NUGET_NEXUS_SERVER_PRIVATE_URL}
  only:
    - master
  retry: 2