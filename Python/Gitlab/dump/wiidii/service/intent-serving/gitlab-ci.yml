stages:
- test
- package
- deploy

pip install:
    stage: test
    image: wiidii/wiidii-python-3.6-ml
    script:
    - pip install --trusted-host tool.wiidii.com --extra-index-url ${PYPI_NEXUS_FOR_DOWNLOAD} corecomponent==0.5.4
    - pip install -r requirements.txt
    - python -m pytest --cov-fail-under ${COVERAGE_PYTHON_SERVICE_THRESHOLD} --cov=src/ tests/
    except:
        - tags

docker build/push:
    stage: package
    image: docker:latest
    services:
        - docker:dind
    variables:
        DOCKER_DRIVER: overlay2
    script:
        - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
        - docker build --build-arg PYPI_NEXUS_FOR_DOWNLOAD=${PYPI_NEXUS_FOR_DOWNLOAD} --build-arg ARG_MLFLOW_TRACKING_URI=${ARG_MLFLOW_TRACKING_URI} --build-arg ARG_AWS_ACCESS_KEY_ID=${ARG_AWS_ACCESS_KEY_ID} --build-arg ARG_AWS_SECRET_ACCESS_KEY=${ARG_AWS_SECRET_ACCESS_KEY} -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA} .
        - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
    only:
        - master
    except:
        - tags

sullust staging:
  stage: deploy
  image:
    name: alpine
  script:
    - apk add --no-cache curl
    - curl -X POST "http://${TRAEFIK_BACK_URL_STAG}/sullust-saas/api/deployment?dockerImage=${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}&environment=${ENVIRONMENT_STAG}"
  environment:
    name: staging
  dependencies: []
  artifacts:
    name: "dump-${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    paths:
      - dump/
    expire_in: 1 hour
  only:
    - master
  except:
    - tags
  retry: 2

sullust production:
  stage: deploy
  image:
    name: alpine
  script:
    - apk add --no-cache curl
    - curl -X POST "http://${TRAEFIK_BACK_URL_STAG}/sullust-saas/api/deployment?dockerImage=${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}&environment=${ENVIRONMENT_PROD}"
  environment:
    name: production
  dependencies: []
  artifacts:
    name: "dump-${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    paths:
      - dump/
    expire_in: 1 hour
  only:
    - tags
  retry: 2
