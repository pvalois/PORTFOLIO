stages:
- test
- package
- deploy

pip install:
    stage: test
    image: wiidii/wiidii-python-3.6-ml-spacy
    script:
    - apk update
    - apk add --no-cache g++ gfortran file binutils musl-dev python3-dev openblas-dev openssl-dev
    - apk add libstdc++ openblas
    - ln -s locale.h /usr/include/xlocale.h
    - pip install --trusted-host tool.wiidii.com --extra-index-url ${PYPI_NEXUS_FOR_DOWNLOAD} corecomponent==0.5.2
    - pip install -r requirements.txt
    - python -m spacy download en
    - python -m spacy download fr
    - python -m spacy link --force en_core_web_sm en
    - python -m spacy link --force fr_core_news_sm fr
    - python -m pytest --cov-fail-under ${COVERAGE_PYTHON_SERVICE_THRESHOLD} --cov=src/ tests/
    except:
        - tags

docker build/push:
    stage: package
    image: docker:latest
    services:
        - docker:dind
    variables:
        DOCKER_DRIVER: overlay2
    script:
        - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
        - docker build --build-arg PYPI_NEXUS_FOR_DOWNLOAD=${PYPI_NEXUS_FOR_DOWNLOAD} -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA} .
        - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
    only:
        - master
    except:
        - tags

sullust staging:
  stage: deploy
  image:
    name: alpine
  script:
    - apk add --no-cache curl
    - curl -X POST "http://${TRAEFIK_BACK_URL_STAG}/sullust-saas/api/deployment?dockerImage=${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}&environment=${ENVIRONMENT_STAG}"
  environment:
    name: staging
  dependencies: []
  artifacts:
    name: "dump-${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    paths:
      - dump/
    expire_in: 1 hour
  only:
    - master
  except:
    - tags
  retry: 2

sullust production:
  stage: deploy
  image:
    name: alpine
  script:
    - apk add --no-cache curl
    - curl -k -X POST "https://${TRAEFIK_FRONT_URL_PROD}/wiidii/gateway/tooling/api/deployment?dockerImage=${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}&environment=${ENVIRONMENT_PROD}" -H "Cust-Secret:eA2E5oRb/BX6WuPlkPuzAfVGIdj5AeKkY8WRq4FHMDux72FBuJjXM0aKjVD5126wWaXN2uQXeGNBxc+zuN4f89cnBUFOY9FMgyEHWNaZ/AhzTLXXGKIrlzt4f9nTQmNH5/kSH0FGZc2Yj2/a0r3h2+Yi7Jjjmptb0vREKe7aIf0="
  environment:
    name: production
  dependencies: []
  artifacts:
    name: "dump-${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    paths:
      - dump/
    expire_in: 1 hour
  only:
    - tags
  retry: 2
