stages:
- build

docker build/push:
    stage: build
    image: docker:latest
    only:
        - master
    services:
        - docker:dind
    variables:
        DOCKER_DRIVER: overlay2
    script:
        - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
        - docker build --build-arg PYPI_IP_STAG=${PYPI_IP_STAG} --build-arg PYPI_PORT_STAG=${PYPI_PORT_STAG} -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA} .
        - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
