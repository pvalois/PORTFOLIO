stages:
- build
- deploy

docker build/push:
    stage: build
    image: docker:latest
    only:
        - master
    services:
        - docker:dind
    variables:
        DOCKER_DRIVER: overlay2
    script:
        - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
        - docker build --build-arg PYPI_IP_STAG=${PYPI_IP_STAG} --build-arg PYPI_PORT_STAG=${PYPI_PORT_STAG} -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA} .
        - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}

horuz deploy:
  stage: deploy
  image: alpine:latest
  only:
    - master
  when: manual
  allow_failure: false
  script:
    - apk add wget
    - rm -rf /var/cache/apk/*
    - wget --content-on-error -qO- --post-data="{\"username\":\"${CI_REGISTRY_USER}\", \"password\":\"${CI_REGISTRY_PASSWORD}\", \"url\":\"${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}\", \"name\":\"${CI_REGISTRY_IMAGE}\", \"container_port\":\"8888\"}" --header='Content-Type:application/json' --http-user=${HORUZ_LOGIN} --http-password=${HORUZ_PASSWD} https://${HORUZ_URL}/api/update
    - exit $?
