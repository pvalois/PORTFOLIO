stages:
  - package
  - deploy
  
docker build/push:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA} .
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
  only:
    - master

sullust staging:
  stage: deploy
  image:
    name: alpine
  script:
    - apk add --no-cache curl
    - curl -X POST "http://${TRAEFIK_BACK_URL_STAG}/sullust-saas/api/deployment?dockerImage=${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}&environment=${ENVIRONMENT_STAG}"
  environment: 
    name: staging
  dependencies: []
  artifacts:
    name: "dump-${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    paths:
      - dump/
    expire_in: 1 hour
  only:
    - master
  except:
    - tags
  retry: 2


sullust production:
  stage: deploy
  image:
    name: ${CI_REGISTRY}/wiidii/tool/sullust-saas:latest
    entrypoint: [""]
  script:
    - dotnet /app/Sullust.dll -ti ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA} -ml ${MARATHON_USER_PROD} -mp ${MARATHON_PASS_PROD} -mu ${MARATHON_URL_PROD} -gt ${SULLUST_GITLAB_TOKEN} -gu ${GITLAB_URL} -tbu ${TRAEFIK_BACK_URL_PROD} -tfs ${TRAEFIK_FRONT_SUFFIX_PROD} -ma ${MONGO_ADMIN_URL_PROD} -env ${ENVIRONMENT_PROD} -mlu ${MARATHON_LB_URL_PROD}
  environment: production
  when: manual
  artifacts:
    name: "dump-${CI_JOB_NAME}-${CI_PROJECT_NAME}-${CI_COMMIT_SHA}"
    paths:
      - dump/
    expire_in: 1 hour
  only:
    - master
